name: Build DJOS ISO

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            live-build xorriso isolinux syslinux-common syslinux-efi \
            grub-pc-bin grub-efi-amd64-bin mtools dosfstools squashfs-tools

      - name: Build ISO
        run: |
          sudo env \
            DJOS_MIRROR=https://deb.debian.org/debian \
            DJOS_MIRROR_SECURITY=https://security.debian.org/debian-security \
            ./build/build-iso.sh

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: DJOS-ISO
          path: |
            out/*.iso
            out/*.sha256
          if-no-files-found: error
          compression-level: 0
