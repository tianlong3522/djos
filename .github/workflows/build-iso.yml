name: Build DJOS ISO

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debootstrap debian-archive-keyring \
            squashfs-tools xorriso \
            grub-common grub-pc-bin grub-efi-amd64-bin \
            mtools dosfstools ca-certificates curl

      - name: Build ISO (teed log)
        run: |
          mkdir -p out
          # 用 git tag 作为 ISO 版本号，文件名形如 DJOS-1.0.15-amd64.iso
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9] ]]; then
            export DJOS_VERSION="${GITHUB_REF_NAME#v}"
          fi
          set -o pipefail
          sudo -E bash ./build/build-iso.sh > build.log 2>&1; RC=$?
          echo "== EXIT CODE: $RC =="
          echo "== ISO files =="
          ls -lh out/ 2>&1 || true
          echo "== log tail (last 80 lines) =="
          tail -n 80 build.log
          echo "== ERROR lines in log =="
          grep -n -E 'E:|Err:|ERROR|error|failed|returned non-zero|command not found|exit code|Killed|Terminated' build.log | tail -n 40 || true
          exit $RC

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
          compression-level: 0

      - name: Publish release asset (log + iso，成败都发，便于取日志)
        if: always() && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build.log
            out/*.iso
            out/*.sha256
          fail_on_unmatched_files: false

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: DJOS-ISO
          path: |
            out/*.iso
            out/*.sha256
          if-no-files-found: error
          compression-level: 0
