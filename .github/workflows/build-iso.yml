name: Build DJOS ISO

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 直接用 Debian bookworm 容器构建，避免 Ubuntu runner 自带旧版 live-build
      # 在安全源 Suite（bookworm/updates）等细节上不兼容。
      - name: Build ISO in Debian bookworm container
        run: |
          mkdir -p out
          docker build -f build/Dockerfile -t djos-builder .
          docker run --rm --privileged \
            -e DJOS_MIRROR="https://deb.debian.org/debian" \
            -e DJOS_MIRROR_SECURITY="https://security.debian.org/debian-security" \
            -v "$PWD/out:/project/out" \
            djos-builder

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: DJOS-ISO
          path: |
            out/*.iso
            out/*.sha256
          if-no-files-found: error
          compression-level: 0

      # ISO 目前约 1.03GiB，远低于 GitHub Release 单文件上限 2GiB，
      # 直接发布单个 .iso 文件，避免切分后用户误烧 part-00 导致截断无法引导。
      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "DJOS NAS 全量离线版 $GITHUB_REF_NAME（下载 .iso 单文件，勿下载部分文件）" 2>/dev/null || true
          OK=0
          for i in 1 2 3 4 5; do
            if gh release upload "$GITHUB_REF_NAME" out/* --clobber; then
              OK=1; break
            fi
            echo "upload attempt $i failed, retrying..."
            sleep 20
          done
          [ "$OK" = 1 ] || { echo "release upload failed after retries"; exit 1; }
          echo "== release assets =="
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name'