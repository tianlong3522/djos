name: Build DJOS ISO

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debootstrap debian-archive-keyring \
            squashfs-tools xorriso \
            grub-common grub-pc-bin grub-efi-amd64-bin \
            mtools dosfstools ca-certificates curl \
            linux-image-generic

      - name: Show environment
        run: |
          uname -a
          sudo debootstrap --version
          which debootstrap mksquashfs grub-mkrescue xorriso linux-image-amd64 2>&1 || true
          ls /boot/vmlinuz-* 2>&1 || true

      - name: Build ISO (teed log)
        run: |
          mkdir -p out
          set -o pipefail
          sudo -E bash -x ./build/build-iso.sh 2>&1 | tee build.log || true
          echo "== log tail =="
          tail -n 60 build.log
          echo "== ISO files =="
          ls -lh out/ || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
          compression-level: 0

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: DJOS-ISO
          path: |
            out/*.iso
            out/*.sha256
          if-no-files-found: error
          compression-level: 0

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.iso
            out/*.sha256
