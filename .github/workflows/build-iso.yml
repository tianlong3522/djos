name: Build DJOS ISO

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debootstrap debian-archive-keyring \
            squashfs-tools xorriso \
            grub-common grub-pc-bin grub-efi-amd64-bin \
            mtools dosfstools ca-certificates curl skopeo

      - name: Build ISO (teed log)
        run: |
          mkdir -p out
          # 用 git tag 作为 ISO 版本号，文件名形如 DJOS-1.0.15-amd64.iso
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9] ]]; then
            export DJOS_VERSION="${GITHUB_REF_NAME#v}"
          fi
          set -o pipefail
          sudo -E bash ./build/build-iso.sh > build.log 2>&1; RC=$?
          echo "== EXIT CODE: $RC =="
          echo "== ISO files =="
          ls -lh out/ 2>&1 || true
          echo "== log tail (last 80 lines) =="
          tail -n 80 build.log
          echo "== ERROR lines in log =="
          grep -n -E 'E:|Err:|ERROR|error|failed|returned non-zero|command not found|exit code|Killed|Terminated' build.log | tail -n 40 || true
          exit $RC

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
          compression-level: 0

      - name: Split ISO if > 1GiB (GitHub Release 单文件上限 2GiB，且镜像站有更小限制)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd out
          ISO=$(ls DJOS-*.iso 2>/dev/null | head -1)
          [ -n "$ISO" ] || { echo "no iso"; exit 1; }
          SIZE=$(stat -c%s "$ISO")
          echo "ISO size: $SIZE bytes"
          if [ "$SIZE" -gt 1073741824 ]; then
            split -b 1024M -d -a 2 "$ISO" "${ISO}.part-"
            rm -f "$ISO"
            echo "split into parts:"
            ls -lh "${ISO}".part-*
          fi

      - name: Publish release asset (log + iso，成败都发，便于取日志)
        if: always() && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "DJOS NAS 全量离线版 $GITHUB_REF_NAME" 2>/dev/null || true
          OK=0
          for i in 1 2 3 4 5; do
            if gh release upload "$GITHUB_REF_NAME" out/* build.log --clobber; then
              OK=1; break
            fi
            echo "upload attempt $i failed, retrying..."
            sleep 20
          done
          [ "$OK" = 1 ] || { echo "release upload failed after retries"; exit 1; }
          echo "== release assets =="
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name'
