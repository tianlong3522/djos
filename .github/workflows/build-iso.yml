name: Build DJOS ISO

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 直接用 Debian bookworm 容器构建，避免 Ubuntu runner 自带旧版 live-build
      # 在安全源 Suite（bookworm/updates）等细节上不兼容。
      - name: Build ISO in Debian bookworm container
        run: |
          mkdir -p out
          docker build -f build/Dockerfile -t djos-builder .
          docker run --rm --privileged \
            -e DJOS_MIRROR="https://deb.debian.org/debian" \
            -e DJOS_MIRROR_SECURITY="https://security.debian.org/debian-security" \
            -v "$PWD/out:/project/out" \
            djos-builder

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: DJOS-ISO
          path: |
            out/*.iso
            out/*.sha256
          if-no-files-found: error
          compression-level: 0

      # GitHub Release 单文件上限 2GiB，超过 1GiB 就切成 part-00/01/...
      - name: Split ISO if > 1GiB
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd out
          ISO=$(ls DJOS-*.iso 2>/dev/null | head -1)
          [ -n "$ISO" ] || { echo "no iso"; exit 1; }
          SIZE=$(stat -c%s "$ISO")
          echo "ISO size: $SIZE bytes"
          if [ "$SIZE" -gt 1073741824 ]; then
            split -b 1024M -d -a 2 "$ISO" "${ISO}.part-"
            rm -f "$ISO"
            echo "split into parts:"
            ls -lh "${ISO}".part-*
          fi

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "DJOS NAS 全量离线版 $GITHUB_REF_NAME" 2>/dev/null || true
          OK=0
          for i in 1 2 3 4 5; do
            if gh release upload "$GITHUB_REF_NAME" out/* --clobber; then
              OK=1; break
            fi
            echo "upload attempt $i failed, retrying..."
            sleep 20
          done
          [ "$OK" = 1 ] || { echo "release upload failed after retries"; exit 1; }
          echo "== release assets =="
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name'
